# Deprecated no-op compatibility file.
#
# Do not copy this file into /etc/netplan and do not hand-edit an interface in
# two places.  G-11 now detects the physical uplink, preserves its MAC, renders
# an early declaration plus a late override, validates the merged hierarchy,
# and arms an independent rollback watchdog:
#
#   ./deploy/scripts/setup-bridge.sh
#
# The no-argument command auto-detects the wired uplink, validates the merged
# Netplan hierarchy, creates a VLAN-aware br0 and keeps an independent rollback
# watchdog armed until the local operator confirms the working network.
#
# Keeping a valid no-op document prevents an old automated copier from
# installing the former enp3s0 example and cutting off the host.
network:
  version: 2
