# /etc/vgpu_unlock/profile_override.toml
#
# vgpu_unlock-rs 运行时读这个文件，按 mdev profile (nvidia-XXX) 做字段级覆写。
#
# 本机可用 profile:
#   ls /sys/bus/pci/devices/0000:04:00.0/mdev_supported_types/ + cat name
#   nvidia-256 = GRID RTX6000-1Q   (1024 MB)
#   nvidia-257 = GRID RTX6000-2Q   (2048 MB)    ← 本项目用这个 (每个 VM 2 GB)
#   nvidia-258 = GRID RTX6000-3Q   (3072 MB)
#   ...
#
# 注意：vgpu_unlock-rs 的 TOML 字段名是 `pci_id` / `pci_device_id`，
# 内部映射到 NVIDIA struct 的 vdev_id / pdev_id。写 16-bit 仅改 device id 部分。
# guest 里 lspci 看到的 vendor:device 另外由 QEMU -device vfio-pci 的
# x-pci-vendor-id / x-pci-device-id / x-pci-sub-* 覆盖（见 start-vm.sh）。

[profile.nvidia-257]
# 安装阶段保留 driver 原生 GRID 名称。start-vm.sh 会按稳定 mdev UUID
# 原子维护 [mdev."UUID"] 的 card_name/adapter_name；这里不能写全局名称，
# 否则所有使用 nvidia-257 的 VM 都会被污染成同一型号。
num_displays = 1
display_width = 1920
display_height = 1080
max_pixels = 2073600
# nvidia-257 原生 2Q 分配是 1856 MiB framebuffer + 192 MiB reservation。
# 两者之和才是 guest 应报告的 2048 MiB；写成 2048+256 会让
# GPU-Z 误报 2304 MB。
framebuffer = 0x74000000             # 1856 MiB
framebuffer_reservation = 0x0c000000 # 192 MiB

# ⚠️  不要覆写 pci_id / pci_device_id。
# 保持 NVIDIA driver 默认报告的 Quadro RTX 6000 (0x10DE:0x1E30) 让 guest 里
# GRID Windows 驱动 INF (nvgridsw.inf) 能按原生 PCI\VEN_10DE&DEV_1E30 匹配上、
# 正常装上。消费卡产品名由 start-vm.sh 按 mdev UUID 在 host 端同步。完整 PCI ID 改写
# 只有在 patched INF 和 catalog 已完成测试后才能启用；当前旧 inf-patch.ps1
# 不能直接处理稳定的 538.33 nvgridsw.inf。目标流程是：
#   1) 装完 GRID 驱动
#   2) inf-patch.ps1 在 INF [Strings]/[NVIDIA_Devices] 段加对应消费卡 DEV
#   3) 完成签名和冷启动绑定验证后，关 VM 并显式传 start-vm.sh --spoof → QEMU
#      x-pci-device-id 把 PCI config space 的 DEV 改成所选型号 → Windows 用修改后
#      的 INF 新条目 bind 同一份 driver。当前默认是方案 B，不会改 PCI ID。
#
# 如果后面要实验性地修改 vGPU manager 内部身份 (而非仅 PCI
# config)，对应的 vgpu_unlock 结构值是 vdev_id=0x1C8111C0
# (device+subdevice) 和 pdev_id=0x1C81。这可能破坏 RM/许可初始化，
# 默认不启用。
#pci_id = 0x1C8111C0
#pci_device_id = 0x1C81
